[project]
name = "pr-review"
version = "0.1.0"
description = "Self-hosted AI pull-request review agent for GitHub"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.25.0",
    "docker>=7.2.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "litellm>=1.106.2",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "tree-sitter>=0.26.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
pr-review = "pr_review.pipeline.cli:main"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "mypy>=1.10",
    "pip-audit>=2.10.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
    "types-docker>=7.2.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review"]

[tool.uv]
# litellm 1.106.3 caps filelock<4.0 although every 3.x release carries open CVEs; filelock is
# used only through huggingface-hub caching, whose API is unchanged in 4.x.
override-dependencies = ["filelock>=4.2.1"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "github: tests that call the real GitHub API with the sandbox App",
    "docker: tests that need a Docker daemon",
    "llm: tests that call a real Ollama server",
    "e2e: full webhook-to-posted-review flow on the sandbox repo",
    "perf: benchmark tests (run explicitly)",
    "load: fault-injection load tests (run explicitly)",
]
